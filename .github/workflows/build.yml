name: Build Fabric Mod

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build Fabric mod
        run: gradle :fabric:build --no-daemon

      - name: Read mod version
        id: properties
        shell: bash
        run: |
          mod_version="$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | xargs)"
          echo "mod_version=${mod_version}" >> "${GITHUB_OUTPUT}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: openysm-fabric-${{ steps.properties.outputs.mod_version }}
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenYSM Fabric ${{ github.ref_name }}
          files: fabric/build/libs/openysm-fabric-${{ steps.properties.outputs.mod_version }}.jar
